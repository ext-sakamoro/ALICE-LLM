note = "the test job's macOS legs add `-C target-feature=+dotprod` (an integer dot-product instruction, no effect on float results: allowed by the guard's policy). .cargo/config.toml holds target-cpu=native only in comment lines, which the guard blanks. The static scan covers the files of this repository and the dynamic check covers the builds CI runs on ubuntu and macOS (the gpu / server feature sets are built in their own jobs and are not in its three sets); a flag passed by a build outside this repository (a consumer's own RUSTFLAGS) is outside both. YAML is not parsed by the static guard (the actionlint job parses the workflows)"
reference_repo = "ALICE-DB"

[features.simd]
guarantee = "outside"
note = "enables the wide::f32x8 paths (src/matrix.rs:209, src/sparse_attention/simd.rs), which multiply and add in another association order than the scalar code; no test compares the simd build's bits with the default build's, so it is not covered by the identifier (G6) yet."

[features.parallel]
guarantee = "outside"
note = "enables rayon (par_iter_mut at src/gguf.rs:3486 and others): row-parallel, and tests/order_independence.rs shows one kernel bit-identical on 1, 4 and 7 threads (G13); the parallel build is not part of the G6 scenarios yet."

[features.gguf]
guarantee = "outside"
note = "enables the GGUF reader and the NEON and AVX2 intrinsic matvec kernels (src/gguf.rs:1384, :2034), which differ by architecture in association order; no cross-architecture bit test covers them yet."

[features.gpu]
guarantee = "outside"
note = "enables the wgpu engine and the WGSL kernels (src/gpu.rs, src/shaders), outside the Law claims; the WGSL arithmetic is not reached by any Rust lint, and the CI gpu legs compare kernels with tolerances and with the previous kernels, not with a recorded bit pattern on every architecture (G4)."

[features.platform-math]
guarantee = "outside"
note = "lawmath calls the platform libm instead of alice-det-math: not Law-bearing by design. It reports LLM_PLATFORM_SEMANTICS_ID, and the KV cache of one mode is refused by the other (G7 / G8). Measured on the reference transformer (vocab 4096, d 512, 8 layers, arm64): 77.1 / 67.0 tok/s prefill / decode against 72.6 / 62.7 for the Law build; logits bit-identical in 264456 of 266240, max difference 2.3e-10, same argmax in 65 of 65 steps."
