[G6]
status = "fail-known"
note = "the crate exports no semantics identifier: src/lib.rs has no SEMANTICS_ID (or equivalent) and Cargo.toml [dependencies] holds no alice-det-math or other Law-bearing crate whose identifier it could fold, so there is no hex test and no pin-change test. The only fingerprint in the crate is the KV cache file's model-shape hash (src/llama3.rs:4911: std DefaultHasher over the layer, kv-head, head-dimension, hidden-dimension and max_seq_len counts and the Debug string of the arch), which says nothing about arithmetic; the std hasher is not guaranteed stable across Rust releases yet its value is written into the KV cache file (src/llama3.rs:4934), so a file may be refused after a toolchain change. Whether inference arithmetic is meant to be a Law-bearing quantity of this crate is a scope question the tree does not answer (docs/CONFORMANCE.md lists inference numerics and ML activations under 'Out of scope')."

