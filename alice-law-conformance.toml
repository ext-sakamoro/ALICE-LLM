# ALICE-Law conformance manifest for this crate (alice-llm). One entry per gate
# defined in ALICE-Law's conformance/gates.toml; the schema (status / evidence /
# mutant / since / note / reference_repo) is the "Manifest" section of
# docs/CONFORMANCE.md in that repository.
#
# Every entry is written from what this repository's tree at the commit below
# shows, checked directly: cargo test --lib (default, simd, and the full feature
# set: 568, 568 and 711 passed), cargo test --release --lib (568 passed), cargo
# test --test analytic_oracle (debug and release, 12 passed), the CI clippy
# commands (ci.yml:116,119,122,125) on all four of their feature sets, and
# type-resolved disallowed-methods / disallowed-types probes (not committed)
# run over `cargo clippy --lib --bins` for the default, simd and full feature
# sets, on aarch64-apple-darwin (built and tested) and x86_64-apple-darwin
# (clippy only, not executed). The full set is std, gguf, parallel, simd, grammar,
# quant, hf-config, dspark, dspark-serde, imatrix, gpu and server (std is a default
# feature; the CI clippy leg of G1 also adds internal-kernel-oracle); every
# feature set built here. Not covered: the examples, fuzz/ and tests/ for the
# probe counts below (the CI clippy commands do build them), and any Linux or
# Windows target.
#
# Premise shared by G6, G7 and G8: this crate is treated as Law-bearing until its
# owner decides the scope question (docs/CONFORMANCE.md lists inference numerics
# and ML activations under 'Out of scope'); a required identifier that is absent
# is therefore fail-known at the place it is absent.
#
# No cell is `pass`: a `pass` needs committed evidence and a named mutant that
# turns it red, and this repository has no Law gate yet (no clippy.toml, no
# alice-det-math dependency, no identifier, no release or aarch64 test leg, no
# scan, no public-text step). `fail-known` says where the requirement is
# absent or unmet. `unverified` means not checked yet, and says what is missing.
#
# Checked at: f8c0927 (origin/main, 2026-10-15).

[G1]
status = "fail-known"
note = "the requirement is absent: there is no clippy.toml or .clippy.toml (no disallowed-methods list for f32 and f64) and the CI clippy commands (.github/workflows/ci.yml:116,119,122,125) pass `-D warnings` over default, simd, the full set and the full set plus internal-kernel-oracle without banning a method; there is no canary. A probe list of the 25 banned names plus powi on f32 and f64 reports 68 sites in library and binary code (not #[cfg(test)]): f32::exp 34, tanh 13, powf 5, sin_cos 4, powi 4, ln_1p 4, ln 2, sin 1, cos 1; 60 of them in the default build and the same 68 on aarch64 and x86_64. Examples: src/linalg.rs:77 (exp) and :84 (tanh), src/rope.rs:18 (powf), :20 (cos), :21 (sin), src/sampling.rs:84 (exp), src/llama3.rs:5325 (powf) and :5327 (sin_cos), src/gpu.rs:79 and :206 (exp, ln_1p), src/training.rs:212 (powi). The crate has no dependency on alice-det-math (Cargo.toml). Planted calls (`x.sin()` on f32 appended to src/linalg.rs, `x.cos()` on f64 inside the gpu feature module src/gpu.rs) passed the CI default and full clippy commands (rc 0, measured 2026-10-15, reverted). powi (pending, banned by default) is called at src/gguf.rs:6429, src/sparse_attention/quant.rs:152 and src/training.rs:212,213, and the crate states no reason for it. The WGSL kernels (src/shaders) are not reached by a Rust lint."
reference_repo = "ALICE-Analytics"

