    "scripts/g1_debt_sites.tsv is empty: scripts/g1_debt_pin.py (clippy with --force-warn clippy::disallowed_methods over the four CI feature sets on x86_64 and aarch64 Linux) finds 0 banned calls in library and binary code and 175 in tests, examples and cfg(test) code (scripts/g1_reference_sites.tsv); run by the g1 job (.github/workflows/ci.yml line 166) and scripts/preflight.sh",
    ".github/workflows/ci.yml clippy job (default, simd, full, full + internal-kernel-oracle, -D warnings) and the g1 job's canary (scripts/clippy_canary.py, 58 planted, generated from clippy.toml)",
]
mutant = "measured 2026-10-17, each reverted: ln_1p as `ln(1.0 + x)` is off by 8368067 ulps at 5.98e-8 and fails tiny_arguments_keep_full_relative_accuracy and the_softplus_range_is_within_the_bound; a direct `x.exp()` call in library code is listed by scripts/g1_debt_pin.py as an unlisted debt site (exit 1, measured 2026-10-17 for the r2 pin, unchanged here)"
since = "3.0.0"
note = "the default features are the Law build. The platform-math feature (off by default, not Law-bearing) makes lawmath call the platform libm instead; it is built in CI (cargo check --all-targets --features platform-math) and reports another semantics identifier (G6), so its KV cache files are refused by the Law build (G8). The gpu feature's WGSL kernels (exp in silu / sigmoid shaders) are outside clippy and outside the Law claims: the Law claims of this manifest hold for the default features on the CPU paths. Measured accuracy of the routing, arm64, 1e6 points per range, against f64 std rounded to f32 (max / mean ulp, alice-det-math vs std): exp 1 / 0.099 vs 1 / 0.006; tanh 0 / 0 vs 1 / 0.003; ln 1 / 0.007 vs 1 / 0; ln_1p 2 / 0.182 vs 1 / 0.002; powf 0 / 0 vs 1 / 0.006; sin and cos 2 ulp up to |x| = 4096, then 4.9e-7 absolute at 32768 and 1.9e-6 at 131072 (std 3.0e-8) — the single-precision range reduction of alice-det-math 0.5; for the rotary angles this is below the rounding of the f32 angle itself."
reference_repo = "ALICE-DB"

