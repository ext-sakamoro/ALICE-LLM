reference_repo = "ALICE-Analytics"

[G3]
status = "fail-known"
note = "no checker for an outer negation of an fma result exists (no script in scripts/, no ci.yml step). The probe reports 6 f32::mul_add calls in library code (src/linalg.rs:84, src/matrix.rs:148,240, src/quantization.rs:56, src/rope.rs:23,24); a read of each finds negation only on an operand (src/rope.rs:23 negates the third argument, `-(vec[i + half] * sin_a)`), none on a whole fma result, and the NEON intrinsics vfmaq_f32 (src/gguf.rs:1633 and others) are not mul_add. That is an audit of today's tree, not a gate: a planted `-(a.mul_add(b, c))` in src/linalg.rs passed the CI default and full clippy commands (rc 0, measured 2026-10-15, reverted), so a later outer negation would not turn anything red. The WGSL kernels use fma( (108 calls in src/shaders/*.wgsl, counted with grep -o; 80 lines contain one) and are not read by any checker. Not n/a: that status needs a scanner that finds zero sites and the mutant of adding one, and there is no scanner."
reference_repo = "ALICE-LOL"

