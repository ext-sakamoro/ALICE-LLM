mutant = "measured 2026-10-17, each reverted: adding `let _bypass = x.sin();` to silu in src/linalg.rs (an item that already carries the #[expect]) leaves the CI default clippy command green (rc 0) and makes scripts/g1_debt_pin.py exit 1 with `not listed in g1_debt_sites.tsv: src/linalg.rs:81:21 f32::sin`; appending a row for a call that does not exist to scripts/g1_debt_sites.tsv makes it exit 1 with `listed ... but not called`; replacing --force-warn with -W in the pin's clippy command makes the fixture test fail (the silenced calls are no longer reported); the canary plants all 52 entries and gets 52 diagnostics"
since = ""
note = "fail-known: the ban list and its canary are in place, but the library calls banned methods. 68 calls in library and binary code (scripts/g1_debt_sites.tsv: f32::exp, tanh, powf, sin_cos, powi, ln_1p, ln, sin, cos in the inference code, for example src/linalg.rs silu / gelu, src/rope.rs, src/sampling.rs, src/llama3.rs, src/gpu.rs) are recorded debt: each enclosing item carries #[expect(clippy::disallowed_methods)] whose reason says so, and the pin fails on a new call or a listed call that is gone. Whether this inference output is Law output, and so whether these calls move to alice-det-math (which changes every output bit and the performance of the hot paths), is an open decision. The 126 reference calls are test oracles and example code. Arch-gated code is linted on both Linux targets; the only OS-gated code (src/gpu.rs:2554 and :2566, query_available_memory_bytes under target_os = linux / not linux) calls no banned method, so no call is outside what the ubuntu runner lints today; a call added later under cfg(target_os = \"macos\") or cfg(windows) would be outside the pin, since both of its targets are Linux. The WGSL kernels (src/shaders) are not reached by a Rust lint."
reference_repo = "ALICE-DB"

