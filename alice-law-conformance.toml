mutant = "measured 2026-10-17, each reverted: the INT8 max fold as `if m > x {m} else {x}` (2 red), the INT8 min fold passing NaN (1), the INT4 min fold keeping the first of a tie, passing NaN, and the INT4 max fold passing NaN (1 each), the softmax max fold passing NaN (1), the gradient clip as comparisons in two forms (1 each); not red: the INT8 min fold keeping the first of a tie, because the INT8 zero point is the midpoint (min + max) / 2 and the +0 max erases the min's sign — that site class has no tie input reaching the public API"
since = "3.0.0"
note = "the clippy ban sees calls, not comparisons written out by hand; the tie tests cover the site classes where a -0 or a NaN reaches a public result. Two comparison rewrites of folds stay green because no tie input reaches a public result: the INT8 min fold, whose min appears only in the zero point (min + max) / 2 and the half range (max - min) / 2 — with an equal pair of zeros the max is +0, so -0 + +0 and +0 + +0 are both +0 and the range is 0 either way; and the softmax max fold, whose max only shifts x - max before exp, where a max of -0 or +0 gives x - max of the same value and exp of a signed zero is 1 either way. The other max / min sites are thresholds against a non-zero constant (`max(1e-12)` / `max(1e-6)` of a norm, `min(1.0)` of a probability ratio, `max(0.0)` of a residual distribution that is renormalised) or folds whose result feeds only a subtraction inside exp (softmax), where no tie input changes a result bit. The crate's SIMD max / min: none (the wide::f32x8 paths in src/matrix.rs and src/sparse_attention/simd.rs multiply and add only), so there is no per-width tie test."
reference_repo = "ALICE-Kinematics"

