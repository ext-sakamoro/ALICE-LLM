    "scripts/g1_debt_pin.py (tests scripts/test_g1_debt_pin.py), run by the g1 job and scripts/preflight.sh: it runs clippy with `--force-warn clippy::disallowed_methods`, which rustc applies over every lint-level attribute in the source (#[allow], #[expect], lint groups, cfg_attr, inner attributes), over every feature set of the clippy job on x86_64 and aarch64 Linux, with --lib --bins and with --all-targets, and fails unless the calls found equal scripts/g1_debt_sites.tsv (68 calls in library and binary code) and scripts/g1_reference_sites.tsv (126 calls in tests, examples and #[cfg(test)] code); it also fails when no feature set was read from ci.yml or no call was found; the test builds a throwaway crate with this clippy.toml whose calls sit under #[allow], an #[expect] on clippy::style, a cfg_attr expect, an inner #![allow] and #[allow(warnings)], and requires every one of them to be reported",
