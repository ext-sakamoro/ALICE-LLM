name: 'ALICE-LLM Optional Bridge Stubs'
description: |
  ALICE-LLM does not currently depend on any ALICE-* sibling crates via
  workspace-relative path deps, so this composite action is a no-op that
  exists only to satisfy the canonical CI template contract
  ([[reference_alice_ci_canonical_template]]).

  If sibling deps are added in the future (e.g. alice-codec, alice-cache),
  extend the loop below following the canonical alice-stubs pattern:
  every generated Cargo.toml must include `license = "MIT OR Apache-2.0"`
  to avoid cargo-deny reject (canonical trap #2).

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        echo "alice-stubs: ALICE-LLM has no ALICE-* sibling path deps (no-op)."
