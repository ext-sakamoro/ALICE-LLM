name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  actionlint:
    name: actionlint (workflow YAML validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

  clippy:
    name: Clippy (lib, warn level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --lib -- -W clippy::all

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: [default, simd]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (default features)
        if: matrix.features == 'default'
        env:
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-C target-feature=+dotprod' || '' }}
        run: cargo test --lib
      - name: cargo test (--features simd)
        if: matrix.features == 'simd'
        env:
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-C target-feature=+dotprod' || '' }}
        run: cargo test --lib --features simd

  gpu_pipeline_smoke:
    # Phase 2 Step 6: catches shader / pipeline compilation regressions that
    # only surface at Metal / Vulkan runtime (e.g., PR #73 row8×batch4
    # exceeded Metal per-shader threadgroup slot limit — CI test passed on
    # ubuntu default features but Mac Metal panicked at GpuEngine::new()).
    #
    # Runs `smoke_test_gpu_pipeline_creation_all_pipelines_valid` which
    # instantiates GpuEngine::new() and catches any pipeline compilation
    # panic, distinguishing "no GPU adapter" (acceptable on headless CI)
    # from real shader validation errors (test fails).
    name: GPU pipeline creation smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest has Apple Metal (Apple Silicon runner), so pipeline
        # creation actually exercises the Metal shader compiler.
        # ubuntu-latest does not have GPU hardware, but the test skips
        # gracefully (compile-check + adapter-absence path).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --features gpu (pipeline smoke test)
        env:
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-C target-feature=+dotprod' || '' }}
        run: cargo test --lib --features gpu smoke_test_gpu_pipeline_creation

  build_release:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --lib

  examples_build:
    # Phase X.8 B-8: catch example bit-rot for grammar-constrained
    # decoding demos. GGUF-dependent examples cannot run in CI (no
    # model shipped) but compile-time verification prevents silent
    # regressions when the underlying API changes.
    #
    # Phase X.8 B-9-C: extended to compile the server binary with the
    # server feature (which now pulls in grammar via
    # server = [..., "grammar"]) so the optional `grammar` field on
    # /v1/completions is protected too.
    name: Examples & server compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --example lol_gen --features "grammar gguf"
        run: cargo build --example lol_gen --features "grammar gguf"
      - name: cargo build --bin alice-llm-server --features server
        run: cargo build --bin alice-llm-server --features server

  notify_failure:
    # Open (or comment on existing) a GitHub Issue automatically when any
    # upstream CI job fails, so pipeline regressions are surfaced as
    # trackable issues rather than silently ignored. Dedupe by workflow
    # name in issue title: multiple failures for the same workflow append
    # comments to a single open issue instead of spamming new issues.
    #
    # Requires `issues: write` because default GITHUB_TOKEN in public
    # repos is issue read-only. Scoped to this job only.
    name: Open issue on CI failure
    runs-on: ubuntu-latest
    needs:
      - fmt
      - actionlint
      - clippy
      - test
      - gpu_pipeline_smoke
      - build_release
      - examples_build
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Ensure ci-failure and auto-opened labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create ci-failure \
            --repo "$REPO" \
            --color d73a4a \
            --description "CI pipeline failure auto-opened by GitHub Actions" \
            2>/dev/null || true
          gh label create auto-opened \
            --repo "$REPO" \
            --color 0e8a16 \
            --description "Automatically opened by a workflow" \
            2>/dev/null || true

      - name: Create or comment on ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh issue list \
            --repo "$REPO" \
            --label ci-failure \
            --state open \
            --json number,title \
            --jq ".[] | select(.title | contains(\"$WORKFLOW\")) | .number" \
            | head -1)
          short_sha="${SHA:0:7}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$REPO" \
              --body "🔴 New failure — run [$RUN_URL]($RUN_URL) — commit \`$short_sha\` on \`$BRANCH\`"
          else
            gh issue create \
              --repo "$REPO" \
              --title "CI failure: $WORKFLOW" \
              --label "ci-failure,auto-opened" \
              --body-file - <<EOF
          **Workflow**: $WORKFLOW
          **Run**: $RUN_URL
          **Commit**: \`$SHA\`
          **Branch**: \`$BRANCH\`

          Auto-opened by CI on failure. Investigate the workflow run URL above.
          Additional failures for the same workflow will append comments to
          this issue until it is closed manually.
          EOF
          fi
