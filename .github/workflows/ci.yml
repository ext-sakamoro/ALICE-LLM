name: CI

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# a newer commit on the same branch stops the older run; on main every commit
# gets its own group and is not stopped
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  actionlint:
    name: actionlint (workflow YAML validation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
      # every job has a job-level timeout-minutes (a hung step otherwise holds a shared
      # runner for GitHub's 6-hour limit); the checker's own tests run first
      - name: workflow-timeouts
        run: |
          python3 scripts/test_workflow_timeouts.py
          python3 scripts/workflow_timeouts.py
      # scripts/changed_paths.py decides whether the path-filtered workflows run (its own tests),
      # then the trigger lint: no on.push paths off main, each pattern file equals its workflow's
      # pull_request paths, the gate job needs every job
      - name: Changed paths tests + trigger lint
        run: |
          python3 scripts/test_changed_paths.py
          python3 scripts/changed_paths.py sync

  docs_lint:
    # Public documents and every tracked file: no development-process vocabulary,
    # device product names or private names; CHANGELOG version headings and
    # [Unreleased] categories well formed. Every check must compare at least one
    # item, so a renamed file cannot turn the gate into a no-op. Run on all three
    # OSes: the script reads UTF-8 explicitly and must not depend on the locale.
    name: Docs lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      # every tests/*.rs is run by a `cargo test` of some workflow, with the features its
      # #![cfg] / #[cfg] lines need (a file no step names would run 0 tests and stay green)
      - name: CI test coverage (tests)
        run: python scripts/test_ci_test_coverage_check.py
      - name: CI test coverage (every tests/*.rs is run by CI)
        run: python scripts/ci_test_coverage_check.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check

  wgsl_lint:
    # No `return`/`discard` before a compute entry point's (last) barrier:
    # a workgroup-uniform guard in that position was measured to still fault
    # on D3D12 WARP (see gpu_pipeline_smoke's job doc) even though it is
    # WGSL-spec-legal. Scans every `src/shaders/*.wgsl` entry point; 0 files
    # or 0 entry points scanned is a failure (compared nothing), not a pass.
    # Run on all three OSes since the script reads UTF-8 explicitly and must
    # not depend on the locale (same reasoning as docs_lint).
    name: WGSL return/discard-before-barrier lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: WGSL lint (tests)
        run: python scripts/test_no_return_before_barrier.py
      - name: WGSL lint (no return/discard before a barrier)
        run: python scripts/no_return_before_barrier.py

  clippy:
    # Hard gate (`-D warnings`, `--all-targets`) over three feature sets:
    # default, `simd` (the wide kernels in sparse_attention/simd.rs) and the
    # full set including gpu / server (wgpu / axum code is otherwise never linted)
    # Until 2026-09-16 this job ran `-W clippy::all` on `--lib` only, which
    # cannot fail; 13 findings in tests / examples had accumulated
    name: Clippy (-D warnings, ${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `gpu-oracle` adds `internal-kernel-oracle` on top of the full set:
        # without it, the old_vs_new / published-2.0.0 / n_sg-rounding test
        # code under that feature gate is never even compiled by this job,
        # let alone linted (caught as a gap during 2.0.1 review).
        features: [default, simd, full, gpu-oracle]
    steps:
      - uses: actions/checkout@v5
        with:
          # the release tags: scripts/id_move_check.py compares with the newest one
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (default features, all targets)
        if: matrix.features == 'default'
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy (simd, all targets)
        if: matrix.features == 'simd'
        run: cargo clippy --all-targets --features simd -- -D warnings
      - name: cargo clippy (full feature set, all targets)
        if: matrix.features == 'full'
        run: cargo clippy --all-targets --features "gguf,parallel,simd,grammar,quant,hf-config,dspark,dspark-serde,imatrix,gpu,server" -- -D warnings
      - name: cargo clippy (full feature set + internal-kernel-oracle, all targets)
        if: matrix.features == 'gpu-oracle'
        run: cargo clippy --all-targets --features "gguf,parallel,simd,grammar,quant,hf-config,dspark,dspark-serde,imatrix,gpu,server,internal-kernel-oracle" -- -D warnings
      # G9: an identifier (LLM_SEMANTICS_ID, LLM_PLATFORM_SEMANTICS_ID) moves only with a breaking version, with the
      # released value in its previous list (when it has one) and both values named in
      # CHANGELOG.md; the released value is read from the published crate at the newest
      # release tag (scripts/id_move_check.py, shared with the other ALICE crates). A
      # registry that cannot be read fails on main and warns on ci/ branches and PRs
      - name: Identifier moves (tests)
        run: python3 scripts/test_id_move_check.py
      - name: Identifier moves (the release compared with)
        id: id-base
        run: echo "crate=$(python3 scripts/id_move_check.py --print-base)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/cache/*/${{ steps.id-base.outputs.crate }}.crate
          key: id-move-${{ steps.id-base.outputs.crate }}
      - name: Identifier moves (against the published release)
        run: python3 scripts/id_move_check.py

  g1:
    # ALICE-Law G1. clippy.toml bans the f32 / f64 methods platform libm may
    # round differently. The canary proves each entry fires on a fresh call
    # (in a throwaway crate the crate's #[expect]s cannot reach). The pin
    # runs clippy with --force-warn clippy::disallowed_methods (stronger than
    # any #[allow] / #[expect] / cfg_attr in the source) over every feature
    # set of the clippy job on both Linux targets (the arch-gated kernels of
    # either), and fails unless the calls found equal
    # scripts/g1_debt_sites.tsv and scripts/g1_reference_sites.tsv
    name: G1 (ban-list canary and recorded-call pin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # the pin lints aarch64 as well; rust-toolchain.toml selects the pinned
      # toolchain, so the target is added to that one
      - name: aarch64 Linux standard library (pinned toolchain)
        run: rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Clippy canary data (generator tests)
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        run: python3 scripts/test_clippy_canary.py
      - name: Clippy canary (every planted banned call is flagged)
        run: python3 scripts/clippy_canary.py
      - name: G1 call pin (tests)
        run: python3 scripts/test_g1_debt_pin.py
      - name: G1 call pin (every banned call is listed, nothing else)
        run: python3 scripts/g1_debt_pin.py

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: [default, simd]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (default features)
        if: matrix.features == 'default'
        env:
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-C target-feature=+dotprod' || '' }}
        run: cargo test --lib
      - name: cargo test (--features simd)
        if: matrix.features == 'simd'
        env:
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-C target-feature=+dotprod' || '' }}
        run: cargo test --lib --features simd
      - name: Analytic oracle tests (closed-form laws)
        if: matrix.features == 'default'
        run: cargo test --test analytic_oracle
      # ALICE-Law G1 / G2: ln_1p against an f64 reference, and the bit-level tie tests of
      # the max / min / clamp sites (scripts/run_tests.sh fails on a binary that ran 0 tests)
      - name: Law tests (lawmath ln_1p, max / min ties, semantics id, order independence)
        if: matrix.features == 'default'
        run: |
          scripts/run_tests.sh lawmath_ln_1p=5,law_max_min_ties=5,semantics_golden=8,llm_semantics_id=9,float_edge_golden=6,running_semantics_id=1 -- cargo test --test lawmath_ln_1p --test law_max_min_ties --test semantics_golden --test llm_semantics_id --test float_edge_golden --test running_semantics_id
          scripts/run_tests.sh order_independence=3 -- cargo test --features gguf,parallel,dspark --test order_independence
          scripts/run_tests.sh lib=12 -- cargo test --lib llama3::tests::kv_cache
      # a GGUF header's counts must not size an allocation and array nesting is bounded
      # (capped allocator in the test binary: a request over 16 MiB is refused, not made)
      - name: GGUF untrusted counts
        if: matrix.features == 'default'
        run: scripts/run_tests.sh gguf_untrusted_counts=4 -- cargo test --test gguf_untrusted_counts
      # the non-Law build (platform libm in lawmath) must keep compiling
      - name: Non-Law build compiles (platform-math)
        if: matrix.features == 'default'
        run: cargo check --all-targets --features platform-math
      # G9: in the platform-math build RUNNING_SEMANTICS_ID is the platform identifier, one of
      # the two scripts/id_move_check.py reads (counted: a test compiled out fails the step)
      - name: Running identifier under platform-math
        if: matrix.features == 'default'
        run: scripts/run_tests.sh running_semantics_id=1 -- cargo test --features platform-math --test running_semantics_id
      - name: Doc tests
        if: matrix.features == 'default'
        run: cargo test --doc --features "gguf,parallel,simd,grammar,quant,hf-config,dspark,dspark-serde,imatrix"

  release:
    # ALICE-Law G4 / G5: the Law-bearing tests under the release profile on x86_64
    # (ubuntu) and aarch64 (macOS, the target whose default codegen fuses multiply-adds):
    # the library tests, the closed-form oracles, the recorded-bit and edge-case goldens,
    # the identifier fold and the order tests (scripts/run_tests.sh fails on a binary
    # that ran fewer tests than named)
    name: Release profile tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tests
      - name: cargo test --release (library)
        run: cargo test --release --lib
      - name: Analytic oracle tests (release)
        run: cargo test --release --test analytic_oracle
      - name: Law tests (release)
        run: |
          scripts/run_tests.sh lawmath_ln_1p=5,law_max_min_ties=5,semantics_golden=8,llm_semantics_id=9,float_edge_golden=6 -- cargo test --release --test lawmath_ln_1p --test law_max_min_ties --test semantics_golden --test llm_semantics_id --test float_edge_golden
          scripts/run_tests.sh order_independence=3 -- cargo test --release --features gguf,parallel,dspark --test order_independence
          scripts/run_tests.sh lib=12 -- cargo test --release --lib llama3::tests::kv_cache

  float-environment:
    # ALICE-Law G14 on each OS: round-to-nearest-even and no flush-to-zero at run
    # time in both profiles (scripts/run_tests.sh float_environment=2 fails unless
    # both tests passed), the static build configuration guard, and on ubuntu /
    # macOS the flags cargo really passes to rustc, read from `-v` in a fresh
    # target directory (scripts/build_flags_check.py)
    name: Float environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Float environment (debug and release)
        run: |
          scripts/run_tests.sh float_environment=2 -- cargo test --test float_environment
          scripts/run_tests.sh float_environment=2 -- cargo test --release --test float_environment
      - name: run_tests.sh and build configuration guard (tests, then check)
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_run_tests.py
          "$PY" scripts/test_entropy_guard.py
          "$PY" scripts/entropy_guard.py
          "$PY" scripts/test_build_config_guard.py
          "$PY" scripts/build_config_guard.py
          "$PY" scripts/test_build_flags_check.py
      # ALICE-Law G11 (c): the files shared with the other crates are the bytes ALICE-Law's
      # table records (table and checker fetched at .github/shared-files-pin, both SHA-256
      # pinned); a difference, an unlisted shared path or nothing compared fails
      - name: Shared files equal ALICE-Law's table
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_shared_files.py
          scripts/shared_files.sh
      # ALICE-Law G11: every gate the manifest declares pass has a row in conformance/g11.toml naming its
      # checker, the canary it must flag and the test that fails when it compared nothing (ALICE-Law's
      # checker fetched at .github/g11-table-pin, SHA-256 pinned; 0 rows compared fails)
      - name: G11 table matches the declared gates
        shell: bash
        run: scripts/g11_table.sh
      - name: ALICE-Law G11 self-check (the four G11 checks at the pinned revision)
        shell: bash
        run: |
          rev=$(awk '$1 == "rev" { print $2 }' .github/shared-files-pin)
          git -c core.autocrlf=false clone --quiet --filter=blob:none https://github.com/ext-sakamoro/ALICE-Law.git "$RUNNER_TEMP/alice-law"
          git -C "$RUNNER_TEMP/alice-law" checkout --quiet --detach "$rev"
          python3 "$RUNNER_TEMP/alice-law/scripts/g11_self_check.py" --repo . --name ALICE-LLM
      - name: Effective rustc flags (default, docs.rs feature set, no default features)
        if: runner.os != 'Windows'
        run: |
          python3 scripts/build_flags_check.py -- cargo check --release --lib
          python3 scripts/build_flags_check.py -- cargo check --release --lib --features "gguf,parallel,simd,grammar,quant,hf-config,dspark,dspark-serde,imatrix"
          python3 scripts/build_flags_check.py -- cargo check --release --lib --no-default-features
      # ALICE-Law G3, syntax-tree pre-check (tools/no-outer-fneg-of-fma, byte-identical to
      # ALICE-LOL's): its own tests, then the check over src/ tests/ examples/ benches/ with
      # the exact fma-call counts of scripts/no-outer-fneg-of-fma-allowlist.toml;
      # the IR half is .github/workflows/g3-ir.yml
      - name: No negated fma result (syntax tree, tests then check)
        run: |
          cargo fmt --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --check
          cargo test --quiet --locked --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --root .

  doc:
    name: rustdoc (-D warnings, docs.rs feature set)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --features "gguf,parallel,simd,grammar,quant,hf-config,dspark,dspark-serde,imatrix"

  gpu_pipeline_smoke:
    # Phase 2 Step 6: catches shader / pipeline compilation regressions that
    # only surface at Metal / Vulkan runtime (e.g., PR #73 row8×batch4
    # exceeded Metal per-shader threadgroup slot limit — CI test passed on
    # ubuntu default features but Apple Silicon (Metal) panicked at GpuEngine::new()).
    #
    # Runs `smoke_test_gpu_pipeline_creation_all_pipelines_valid` which
    # instantiates GpuEngine::new() and catches any pipeline compilation
    # panic, distinguishing "no GPU adapter" (acceptable on headless CI)
    # from real shader validation errors (test fails).
    #
    # windows-latest additionally exercises the D3D12 WARP software adapter
    # (GitHub's windows-latest runners have no hardware GPU, so `wgpu`'s
    # default adapter request lands on WARP). WARP does not advertise the
    # `SUBGROUP` feature at all, and 14 of this crate's 16 kernels require
    # it, so `GpuEngine::new()` (which builds every kernel's pipeline
    # eagerly) cannot construct on this runner — every test that needs it
    # prints a named, counted marker line (`try_gpu_engine`'s
    # `SUBGROUP_UNSUPPORTED_MARKER` in src/gpu.rs) and skips rather than
    # failing red or silently passing. This is a tracked, documented gap
    # (tracked as a known, documented gap), not a regression; the root fix (lazy
    # per-kernel pipeline construction + a subgroup-free fallback reduction
    # path, making this leg green without a skip) is a separate, later
    # release. This leg still runs the matvec/attention/sparse-attention
    # GPU-dispatch correctness tests (not just pipeline creation), including:
    #   - the single out-of-range-workgroup oracle against a CPU reference
    #     (matvec_q1_0_out_of_range_workgroups_do_not_corrupt_in_bounds_rows)
    #   - the full bit-identical old-vs-new oracle for all 16 rewritten
    #     kernels (`old_vs_new_oracle` module, `internal-kernel-oracle`
    #     feature — builds the pre-rewrite kernel from
    #     `tests/ref_shaders/*_old.wgsl`, excluded from the published
    #     package, see `Cargo.toml`), swept over 0/1/non-multiple/tile±1
    #     sizes per kernel, asserting old and new agree bit-for-bit
    name: GPU pipeline creation + dispatch correctness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # A missing adapter fails the GPU tests instead of skipping them (every
    # runner in the matrix has one: Metal / lavapipe / WARP). The SUBGROUP gap
    # of WARP stays a separate, named skip.
    env:
      ALICE_LLM_REQUIRE_GPU: '1'
    strategy:
      fail-fast: false
      matrix:
        # macos-latest has Apple Metal (Apple Silicon runner), so pipeline
        # creation actually exercises the Metal shader compiler.
        # windows-latest has no hardware GPU either; `wgpu`'s DX12 backend
        # enumerates the WARP software adapter, which lacks SUBGROUP (see
        # above) — most of this leg's tests print the named skip marker.
        # ubuntu-latest does not have GPU hardware and no software compute
        # fallback either, so the test skips gracefully (compile-check +
        # adapter-absence path) — kept for the pure compile-check signal.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Proves this job's shell actually fails a step when a piped
      # producer fails — the exact property every `| tee` below depends on.
      # Catches a regression in either direction: an omitted `shell: bash`
      # (silently back to the platform default, no pipefail on Linux/macOS)
      # or a GitHub Actions / runner-image change to that default.
      - name: "Self-test: a failing producer must fail this step (pipefail)"
        shell: bash
        run: |
          set -o pipefail
          if (false | tee pipefail_selftest.log); then
            echo "::error::pipefail self-test did NOT fail — piping a failing command through tee was not caught; shell lacks -o pipefail"
            exit 1
          fi
          echo "pipefail self-test ok: a failing producer piped through tee correctly failed this step"
      # lavapipe (Mesa's software Vulkan rasterizer) so ubuntu-latest's
      # `wgpu` adapter request finds a real, working adapter instead of
      # falling through the "no GPU adapter found" skip path — without
      # this, the ubuntu leg below only compile-checks and never actually
      # dispatches a kernel.
      - name: Install lavapipe (software Vulkan, ubuntu-latest only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      # windows-latest (WARP) runs the same NEW-kernel-only tests as the
      # other two OSes, but never `old_vs_new_oracle::`: that module builds
      # and DISPATCHES the pre-rewrite reference kernel (the one with the
      # return-before-barrier pattern this whole patch exists to remove),
      # which is exactly the shape measured to crash WARP — running it there
      # would make this leg red by construction, not because of a real
      # regression. The old-vs-new comparison only runs where the OLD kernel
      # can safely execute (ubuntu-latest's lavapipe / macos-latest's
      # Metal); windows-latest instead gets new-vs-CPU-reference coverage
      # (q5k/q8_0 today; more to follow), which exercises the NEW kernel
      # only — but even that cannot construct `GpuEngine` on WARP for the
      # 14 kernels requiring SUBGROUP (see the matrix comment above and
      # `SUBGROUP_UNSUPPORTED_MARKER` in src/gpu.rs), so most of this leg's
      # tests print the named skip marker rather than exercising dispatch.
      # `--nocapture` so the measured worst_rel each test eprintln!s is
      # visible in the CI log (cargo otherwise captures/hides stdout+stderr
      # for passing tests), needed to calibrate the tolerance constants
      # from real per-backend data rather than a single developer machine.
      - name: cargo test --features gpu (pipeline smoke + dispatch correctness, windows-latest)
        if: matrix.os == 'windows-latest'
        # pwsh (this runner's default shell) uses `` ` `` for line
        # continuation, not `\` — force bash (present via Git for Windows)
        # so the `\`-continued multi-line command below parses correctly.
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib --features gpu -- \
            smoke_test_gpu_pipeline_creation \
            q5k_matvec_matches_cpu_dequant_reference \
            q8_0_matvec_matches_cpu_dequant_reference \
            matvec_q1_0_out_of_range_workgroups_do_not_corrupt_in_bounds_rows \
            cpu_reference_oracle:: \
            integration_tests::test_attention \
            sparse_attention::gpu::tests:: \
            --nocapture 2>&1 | tee test_output.log
      - name: cargo test --features gpu (pipeline smoke + dispatch correctness + old-vs-new oracle, ubuntu/macos)
        if: matrix.os != 'windows-latest'
        env:
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-C target-feature=+dotprod' || '' }}
        # GitHub's IMPLICIT default shell (no `shell:` key at all) is plain
        # `bash -e {0}` — NOT `-o pipefail` — so `cmd | tee file` here would
        # silently swallow `cargo test`'s real exit code behind `tee`'s
        # (near-always 0) one, reporting this step green even when the
        # underlying tests failed. Explicitly requesting `shell: bash`
        # expands to the FULL `bash --noprofile --norc -eo pipefail {0}`
        # invocation, which is what every other step in this job that
        # already declares `shell: bash` gets.
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib --features gpu,internal-kernel-oracle -- \
            smoke_test_gpu_pipeline_creation \
            q5k_matvec_matches_cpu_dequant_reference \
            q8_0_matvec_matches_cpu_dequant_reference \
            matvec_q1_0_out_of_range_workgroups_do_not_corrupt_in_bounds_rows \
            old_vs_new_oracle:: \
            cpu_reference_oracle:: \
            integration_tests::test_attention \
            sparse_attention::gpu::tests:: \
            --nocapture 2>&1 | tee test_output.log
      # A leg that silently found no adapter at all (lavapipe missing /
      # Metal unavailable) must not pass by default — ubuntu-latest ran 0.05s
      # for 18 "tests" before lavapipe was installed here, meaning every one
      # of them had hit the no-adapter skip and the whole leg was vacuous.
      # Require evidence of either a genuinely-constructed engine
      # (`[gpu] adapter:`, printed once per successful GpuEngine::new()) or
      # the counted, named SUBGROUP skip marker (the one documented,
      # intentional case where 0 engine constructions is still legitimate:
      # windows-latest/WARP). Zero of both means the gate itself ran nothing.
      - name: Require real GPU test evidence (no silent 0-test pass)
        # windows-latest's default shell is pwsh, which does not understand
        # this bash conditional syntax (`[ ... ]`) — force bash (present via
        # Git for Windows) on every OS for consistency.
        shell: bash
        run: |
          adapter_count=$(grep -c '\[gpu\] adapter:' test_output.log || true)
          marker_count=$(grep -c 'GpuEngine cannot be constructed (SUBGROUP unsupported)' test_output.log || true)
          sparse_count=$(grep -c '\[gpu\] sparse attention device acquired' test_output.log || true)
          skip_count=$(grep -c 'SKIP: no GPU adapter available' test_output.log || true)
          echo "adapter_count=$adapter_count marker_count=$marker_count sparse_count=$sparse_count skip_count=$skip_count"
          if [ "$adapter_count" -eq 0 ] && [ "$marker_count" -eq 0 ]; then
            echo "::error::this leg exercised 0 GPU tests (no adapter constructed, no named skip marker printed) — gate defect, not a legitimate pass"
            exit 1
          fi
          # sparse attention needs no SUBGROUP, so it must run on every leg
          if [ "$sparse_count" -eq 0 ]; then
            echo "::error::no sparse attention GPU device was acquired on this leg"
            exit 1
          fi
          # unreachable under ALICE_LLM_REQUIRE_GPU (a missing adapter panics);
          # kept so that a skip path which bypasses the policy is still caught
          if [ "$skip_count" -ne 0 ]; then
            echo "::error::$skip_count GPU test(s) skipped for a missing adapter"
            exit 1
          fi
      # The requirement has teeth: with the adapter hidden the smoke test must
      # fail on the ALICE_LLM_REQUIRE_GPU panic.
      - name: "Self-test: a hidden adapter fails the GPU tests"
        shell: bash
        run: bash scripts/gpu_require_selftest.sh --lib --features gpu smoke_test_gpu_pipeline_creation

  build_release:
    name: Build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --lib

  examples_build:
    # Phase X.8 B-8: catch example bit-rot for grammar-constrained
    # decoding demos. GGUF-dependent examples cannot run in CI (no
    # model shipped) but compile-time verification prevents silent
    # regressions when the underlying API changes.
    #
    # Phase X.8 B-9-C: extended to compile the server binary with the
    # server feature (which now pulls in grammar via
    # server = [..., "grammar"]) so the optional `grammar` field on
    # /v1/completions is protected too.
    name: Examples & server compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --example lol_gen --features "grammar gguf"
        run: cargo build --example lol_gen --features "grammar gguf"
      - name: cargo build --bin alice-llm-server --features server
        run: cargo build --bin alice-llm-server --features server
      # The real server binary: default bind on loopback, and exit on stdin
      # close with --exit-on-stdin-eof (model path is a FIFO, no model file)
      - name: server lifecycle tests
        run: |
          scripts/run_tests.sh server_lifecycle=3 -- cargo test --features server --test server_lifecycle
          scripts/run_tests.sh lib=6 -- cargo test --lib server_cli

