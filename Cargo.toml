[package]
name = "alice-llm"
version = "3.0.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
license = "LicenseRef-Proprietary"
publish = false
description = "Pure Rust LLM inference engine — GGUF v3 parser, K-quants, hybrid CPU/GPU DeltaNet+Attention, wgpu compute shaders, speculative decoding, OpenAI-compatible HTTP server."
readme = "README.md"
# the published crate: the library and binary sources (shaders are under src/), the examples
# declared below, and the documents a user of the crate reads (scripts, logs, docs/, CI files and
# test data stay in the repository); a leading / anchors a pattern at the crate root
include = [
    "/src/**",
    "/examples/**",
    "/README.md",
    "/README_JP.md",
    "/CHANGELOG.md",
    "/LICENSE-Proprietary",
    "/NOTICE",
]
repository = "https://github.com/ext-sakamoro/ALICE-LLM"
homepage = "https://github.com/ext-sakamoro/ALICE-LLM"
documentation = "https://docs.rs/alice-llm"
keywords = ["llm", "inference", "gguf", "gpu", "quantization"]
categories = ["science", "algorithms", "wasm"]
# Pre-rewrite WGSL kept only as a test-only bit-identical oracle reference
# (`tests/ref_shaders/*_old.wgsl`, `include_str!`-ed from the
# `internal-kernel-oracle`-gated tests in src/gpu.rs / src/sparse_attention/
# gpu.rs) — never shipped. No `exclude` is needed for this: the `include`
# allowlist above already omits `tests/` entirely, and Cargo ignores
# `exclude` outright once `include` is present (`cargo package --list`
# warns "both package.include and package.exclude are specified; the
# exclude list will be ignored" if both are set — verified).

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = []
gguf = ["dep:memmap2", "dep:libc"]
parallel = ["dep:rayon"]
simd = ["dep:wide"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
grammar = []
quant = []
server = ["dep:axum", "dep:tokio", "dep:serde", "dep:serde_json", "dep:async-stream", "gpu", "gguf", "grammar"]
hf-config = ["dep:serde", "dep:serde_json"]
dspark-serde = ["dep:serde"]
dspark = []
# Phase I.0 + I.3: ALICE-Dynamic-v1 tier-decision CLI.
# Emits `layer_assignments.json` from a GGUF using the Unsloth-baseline
# heuristics (no calibration data required); see `src/imatrix/heuristic.rs`.
imatrix = ["gguf", "dep:serde", "dep:serde_json"]
# Dev-only: enables the bit-identical old-vs-new kernel oracle tests, which
# `include_str!` the pre-rewrite reference shaders under `tests/ref_shaders/`
# (excluded from the published package, see `exclude` below). Not in
# `default`, so `cargo test --features gpu` on the published/unpacked crate
# never references the excluded files; only a git checkout (where those
# files physically exist) is expected to build with this feature on.
internal-kernel-oracle = ["gpu"]
# Non-Law build: `lawmath` calls the platform libm instead of alice-det-math
# (faster on some targets, bits differ by OS / CPU / compiler). It reports
# another semantics identifier and the KV cache reader refuses files written
# by the other mode. Off by default.
platform-math = []

[dependencies]
# Law helpers: transcendental functions and max / min that return the same
# bits on every target (ALICE-Law G1 / G2), through src/lawmath.rs; by git + rev, the source every
# ALICE repository uses, so one build links one alice-det-math
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", rev = "6384856c8b00f1615e1cd6b5c74d88036c1a8706", version = "0.5.2" }
memmap2 = { version = "0.9", optional = true }
libc = { version = "0.2", optional = true }
rayon = { version = "1.10", optional = true }
wide = { version = "0.7", optional = true }
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
async-stream = { version = "0.3", optional = true }

[[example]]
name = "sparse_attention_demo"

[[example]]
name = "bench_grammar_mask"
required-features = ["gguf", "grammar"]

[[example]]
name = "elyza_gguf"
required-features = ["gguf"]

[[example]]
name = "logits_compare"
required-features = ["gguf"]

[[example]]
name = "bench_70b_sparse"
required-features = ["gguf"]

[[example]]
name = "speculative_dual"
required-features = ["gguf"]

[[example]]
name = "test_1b"
required-features = ["gguf"]

[[example]]
name = "test_q3k"
required-features = ["gguf"]

[[example]]
name = "bench_gpu"
required-features = ["gguf", "gpu"]

# v1.5.0: Metal / Vulkan / DX12 determinism ε-bound bench for the new
# forward_with_early_exit_and_read / forward_with_surprise_and_read
# APIs on GpuModel. Runs paired same-seed forwards, reports max
# |Δlogits|, and asserts early-exit-at-full-depth parity with the
# existing full-forward path.
[[example]]
name = "metal_determinism_check"
required-features = ["gguf", "gpu"]

[[example]]
name = "bench_gpu_q1_0"
required-features = ["gguf", "gpu"]

[[example]]
name = "bench_gpu_ffn"
required-features = ["gguf", "gpu"]

[[example]]
name = "bench_gpu_forward"
required-features = ["gguf", "gpu"]

[[example]]
name = "generate_gpu"
required-features = ["gguf", "gpu"]

[[example]]
name = "speculative_gpu"
required-features = ["gguf", "gpu"]

[[example]]
name = "speculative_dual_gpu"
required-features = ["gguf", "gpu"]

[[example]]
name = "qwen_gpu"
required-features = ["gguf", "gpu"]

[[example]]
name = "bench_simd_matvec"
required-features = ["gguf"]

[[example]]
name = "bench_deepseek_streaming"
required-features = ["gguf"]

# Observation tool for entropy-driven Mixture-of-Depths (MoD) experiments.
# Emits per-(token, layer) hidden-state statistics as JSONL for post-hoc
# analysis of natural thresholds for depth routing / early-exit strategies.
# See Schuster et al. 2022 (CALM) + Raposo et al. 2024 (Mixture-of-Depths).
[[example]]
name = "entropy_mod_qwen35"
required-features = ["gguf"]

# Correlation validation tool: pairs hidden-state variance (candidate depth-
# routing signal) with per-token log-loss (ground-truth difficulty). Used to
# check whether a bimodal signal actually predicts token difficulty before
# committing to a routing implementation.
[[example]]
name = "entropy_ppl_correlation_qwen35"
required-features = ["gguf"]

# Phase X.8 B-8: grammar-constrained decoding demo. Points a GGUF model
# at any GBNF file (LOL / JSON schema / tool-call) and prints the
# guaranteed-valid output.
[[example]]
name = "lol_gen"
required-features = ["grammar", "gguf"]

# Phase X.4.b + X.4.c.3.3.d: Kimi K3 GGUF end-to-end forward test.
# Loads a merged K3 GGUF (single file, use `llama-gguf-split --merge`
# on split shards first), runs one forward pass, prints top-5 logits.
[[example]]
name = "kimi_k3_forward"
required-features = ["gguf", "hf-config"]

# Phase X.4.b.8: Kimi K3 multi-token greedy generate. Encodes prompt
# via tokenizer, runs prefill + decode loop, prints streamed text.
[[example]]
name = "kimi_k3_generate"
required-features = ["gguf", "hf-config"]

# DSpark Phase 5: llama3 speculative dual with MarkovBigramBias
# baseline vs bigram_strength 0.1/0.5/1.0 で accept rate + tok/s を比較
[[example]]
name = "speculative_dspark_dual"
required-features = ["dspark", "gguf"]

# DSpark Phase 7: PositionConfidenceHead 学習 example
# vanilla dual を走らせて (hidden, was_accepted) label を collect し
# SGD BCE で PositionConfidenceHead を学習、bincode で save
[[example]]
name = "dspark_train_confidence_head"
required-features = ["dspark", "dspark-serde", "gguf"]

[[bin]]
name = "alice-llm-server"
path = "src/bin/server.rs"
required-features = ["server"]

# Phase I.0 + I.3: ALICE-Dynamic-v1 tier-decision CLI.
[[bin]]
name = "alice-llm-imatrix"
path = "src/bin/imatrix.rs"
required-features = ["imatrix"]

# DSpark Phase 4 serde roundtrip test 用 (dspark-serde feature 有効時のみ使用)
[dev-dependencies]
# SHA-256 of the recorded-bit scenarios (tests/semantics_golden.rs) and of the
# semantics identifier fold (tests/llm_semantics_id.rs)
sha2 = "0.10"
bincode = "1"
