# ALICE-Law G13: hash collections iterate in an order that differs between runs,
# and a thread whose results are combined makes the order depend on scheduling.
# src/lookup.rs is the one module allowed to name the hash collections (keyed
# access only, no iteration); scripts/order_guard.py is the source-reading half.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is unspecified and differs between runs (ALICE-Law G13); use BTreeMap / BTreeSet, or crate::lookup::LookupMap / LookupSet for keyed access only" },
    { path = "std::collections::HashSet", reason = "iteration order is unspecified and differs between runs (ALICE-Law G13); use BTreeMap / BTreeSet, or crate::lookup::LookupMap / LookupSet for keyed access only" },
    { path = "std::collections::hash_map::Iter", reason = "iteration order is unspecified and differs between runs (ALICE-Law G13); use BTreeMap / BTreeSet, or crate::lookup::LookupMap / LookupSet for keyed access only" },
    { path = "std::collections::hash_map::IterMut", reason = "iteration order is unspecified and differs between runs (ALICE-Law G13); use BTreeMap / BTreeSet, or crate::lookup::LookupMap / LookupSet for keyed access only" },
    { path = "std::collections::hash_map::Keys", reason = "iteration order is unspecified and differs between runs (ALICE-Law G13); use BTreeMap / BTreeSet, or crate::lookup::LookupMap / LookupSet for keyed access only" },
    { path = "std::collections::hash_map::Values", reason = "iteration order is unspecified and differs between runs (ALICE-Law G13); use BTreeMap / BTreeSet, or crate::lookup::LookupMap / LookupSet for keyed access only" },
    { path = "std::collections::hash_map::ValuesMut", reason = "iteration order is unspecified and differs between runs (ALICE-Law G13); use BTreeMap / BTreeSet, or crate::lookup::LookupMap / LookupSet for keyed access only" },
    { path = "std::collections::hash_map::IntoIter", reason = "iteration order is unspecified and differs between runs (ALICE-Law G13); use BTreeMap / BTreeSet, or crate::lookup::LookupMap / LookupSet for keyed access only" },
    { path = "std::collections::hash_map::IntoKeys", reason = "iteration order is unspecified and differs between runs (ALICE-Law G13); use BTreeMap / BTreeSet, or crate::lookup::LookupMap / LookupSet for keyed access only" },
