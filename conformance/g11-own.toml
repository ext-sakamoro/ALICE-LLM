# ALICE-Law G11: this repository's own rows of conformance/g11.toml (the rows of the checkers the ALICE
# crates share are generated from ALICE-Law). ALICE-Law's scripts/g11_table_gen.py writes conformance/g11.toml
# from both (python3 scripts/g11_table_gen.py --repo <this repository> --name ALICE-LLM --write, run in an
# ALICE-Law checkout); the table is committed with the regeneration of ALICE-Law's shared-files table that
# lists this repository, not before.
#
# The Law suites are run by scripts/run_tests.sh, which fails a step when a named test binary ran fewer
# tests than named; its zero test is therefore the compared-nothing test of each leg, and each canary is
# a test of a binary the leg names.

[[row]]
gate = "G2"
checker = ".github/workflows/ci.yml#- name: Law tests (lawmath ln_1p, max / min ties, semantics id, order independence)>scripts/run_tests.sh"
canary = "tests/law_max_min_ties.rs::quantize_of_a_pair_of_zeros_has_a_positive_zero_point"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]

